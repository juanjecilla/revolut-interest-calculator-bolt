<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Calculator body -->
  <rect x="8" y="6" width="16" height="20" rx="2" stroke="white" stroke-width="1.5"/>
  <!-- Display -->
  <rect x="10" y="8" width="12" height="5" rx="1" fill="white" opacity="0.9"/>
  <!-- Buttons -->
  <circle cx="12" cy="17" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="16" cy="17" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="20" cy="17" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="12" cy="21" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="16" cy="21" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="20" cy="21" r="1.2" fill="white" opacity="0.8"/>
</svg>
